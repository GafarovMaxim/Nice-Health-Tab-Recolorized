name: Build & Verify

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Validate XML Syntax
      shell: pwsh
      run: |
        $xmls = Get-ChildItem -Recurse -Filter "*.xml"
        foreach ($f in $xmls) {
          try {
            [xml](Get-Content $f.FullName) | Out-Null
          } catch {
            Write-Error "Invalid XML in $($f.FullName): $_"
          }
        }
        Write-Host "All XML files valid!"
